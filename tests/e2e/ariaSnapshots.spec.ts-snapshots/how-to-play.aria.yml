- dialog "How to play":
  - heading "How to play" [level=2]
  - region "How to play":
    - heading "The goal" [level=3]
    - paragraph: Stop the enemies reaching the exit. Each one that gets through costs Lives, and you start with 20 Lives. Lose them all and the game is lost.
    - heading "Money" [level=3]
    - paragraph: You start with 100 Money. Every enemy you stop pays a reward. Towers and upgrades cost Money. Selling a tower refunds 70% of what you spent on it, after 2 seconds.
    - heading "Placing, upgrading and selling" [level=3]
    - list:
      - listitem: "Place: pick a tower in the build bar, then tap a buildable tile."
      - listitem: "Upgrade: tap a tower to open its panel, then Upgrade. Each level adds range or firepower."
      - listitem: "Sell: tap a tower, then Sell."
    - heading "Ground, air and armor" [level=3]
    - list:
      - listitem: "Ground and air: every enemy walks or flies, and each tower can hit only some layers."
      - listitem: "Armor: armor is subtracted from every hit, so weak rounds do little against armored enemies."
    - heading "Towers" [level=3]
    - list:
      - listitem: "Rifle Nest (50): Cheap all-rounder: hits ground and air. Light rounds that armor soaks."
      - listitem: "AA Gun (75): Built for aircraft: fast, light rounds. Hits ground too."
      - listitem: "Cannon (100): Slow, heavy shells that punch through armor. Ground only."
      - listitem: "Mortar (125): Long-range shells that hit everything in the blast. Ground only, not up close."
    - heading "Enemies" [level=3]
    - list:
      - listitem: "Infantry (reward 4): No armor: every tower hurts it. Mortar blasts catch whole squads."
      - listitem: "Tank (reward 25): Armor: Rifle Nests barely scratch it. Cannons and Mortars work."
      - listitem: "Jeep (reward 3): Fast but fragile, no armor: quick-firing Rifle Nests and AA Guns catch it."
      - listitem: "Helicopter (reward 10): Flies: only Rifle Nests and AA Guns reach it. Its armor blunts rifle rounds; AA Guns work best."
      - listitem: "APC (reward 12): Armored carrier. Kill it and its squad jumps out."
      - listitem: "Heavy tank (reward 120): Boss. Heavy armor, huge HP. Leaking it costs 10 Lives."
      - listitem: "Jet (reward 6): Fast, fragile jet. Needs AA coverage along the route."
    - heading "Keys" [level=3]
    - table:
      - rowgroup:
        - row "Key Action":
          - columnheader "Key"
          - columnheader "Action"
      - rowgroup:
        - row "1–9 Pick a tower to build":
          - rowheader "1–9"
          - cell "Pick a tower to build"
        - row "U Upgrade the selected tower":
          - rowheader "U"
          - cell "Upgrade the selected tower"
        - row "S Sell the selected tower":
          - rowheader "S"
          - cell "Sell the selected tower"
        - row "Space Start the next wave":
          - rowheader "Space"
          - cell "Start the next wave"
        - row "F Change the game speed":
          - rowheader "F"
          - cell "Change the game speed"
        - row "P / Esc Pause (Esc cancels a selection first)":
          - rowheader "P / Esc"
          - cell "Pause (Esc cancels a selection first)"
        - row "? / H Show these keys":
          - rowheader "? / H"
          - cell "Show these keys"
  - button "Back"
