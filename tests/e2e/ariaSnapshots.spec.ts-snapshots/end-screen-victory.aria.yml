- dialog "MISSION COMPLETE":
  - heading "MISSION COMPLETE" [level=2]
  - paragraph: 3 of 3 stars
  - paragraph: "New map unlocked: Switchback"
  - paragraph: "Difficulty: Normal"
  - heading "After-action report" [level=3]
  - paragraph: Waves survived 1 / 1
  - table "By tower type":
    - caption: By tower type
    - rowgroup:
      - row "Type Towers Damage Kills DPS":
        - columnheader "Type"
        - columnheader "Towers"
        - columnheader "Damage"
        - columnheader "Kills"
        - columnheader "DPS"
    - rowgroup:
      - row "Rifle Nest 1 30 1 29.0":
        - rowheader "Rifle Nest":
          - button "Rifle Nest"
        - cell "1"
        - cell "30"
        - cell "1"
        - cell "29.0"
  - table "By wave":
    - caption: By wave
    - rowgroup:
      - row "Wave Time Damage Kills DPS":
        - columnheader "Wave"
        - columnheader "Time"
        - columnheader "Damage"
        - columnheader "Kills"
        - columnheader "DPS"
    - rowgroup:
      - row "1 1.0 s 30 1 29.0":
        - rowheader "1"
        - cell "1.0 s"
        - cell "30"
        - cell "1"
        - cell "29.0"
    - rowgroup:
      - row "Total 1.0 s 30 1 29.0":
        - rowheader "Total"
        - cell "1.0 s"
        - cell "30"
        - cell "1"
        - cell "29.0"
  - button "Restart"
  - button "Operations"
