name: Bug
description: Something in the game doesn't work as expected
labels: ["bug", "needs-triage"]
body:
  - type: input
    id: version
    attributes:
      label: Game version
      description: Shown in the corner of the game (e.g. 0.1.3)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Ideally as a scenario (map, towers placed, wave) so it can become a test
    validations:
      required: true
