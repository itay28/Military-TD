name: CI

# Guards main: every PR and every push to main must typecheck, lint, pass the
# format check and tests, build, and fit itch.io's HTML5 limits (ADR-0005).
# The job id and name stay `ci` so it can be a required check in main's branch
# protection.
on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the build fits itch.io
        run: node scripts/itch-build.ts dist
