name: Split issue

# The split agent (#303): when an implement session dies twice on an issue (the first fire and
# its one retry), auto-start gives up on it and labels it `needs-split` (with PROJECT_TOKEN, so
# this runs). Claude (Opus) splits it into 2–4 smaller issues that each fit one session, closes
# the original, and dispatches Board sync, which can start the first part. Prompt:
# docs/agents/prompts/split.md. A part that dies twice too is handed to the maintainer, not split
# again (`split-part`). The agent only gets GITHUB_TOKEN. It doesn't link the parts: it writes
# split-plan.json and a plain step links them (scripts/split-links.ts, #488), since the agent's own
# link calls were denied at random. Needs the NTFY_TOPIC secret to push a link failure.
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to split
        required: true
        type: number

concurrency:
  group: split-issue-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  split-issue:
    # Only auto-start (it labels as the maintainer) or the maintainer starts it: anyone can't spend the plan.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'needs-split' && github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      # Pointing the dead session's draft PR at the first part.
      pull-requests: write
      # Dispatching Board sync afterwards.
      actions: write
      id-token: write
    env:
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Split it
        id: split
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read docs/agents/prompts/split.md and follow it for issue #${{ env.ISSUE }} in ${{ github.repository }}.
            You are running in CI. Nobody can answer questions, so don't ask any.
          claude_args: '--model opus --allowedTools "Read,Glob,Grep,Edit(./split-plan.json),Write(./split-plan.json),Bash(git log:*),Bash(git diff:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh issue close ${{ env.ISSUE }} *),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh api repos/${{ github.repository }}/issues/*),Bash(gh api repos/${{ github.repository }}/milestones*)"'

      # Kept a week, so the agent's permission denials can be read later (#488).
      - name: Upload Claude's execution output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-output
          path: ${{ steps.split.outputs.execution_file }}
          retention-days: 7
          if-no-files-found: ignore

      - name: Set up Node
        if: hashFiles('split-plan.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # No plan file means the agent didn't split (it handed the issue to the maintainer instead).
      # On a missing link it comments on that part, labels it needs-you, pushes and fails.
      - name: Link the parts
        if: hashFiles('split-plan.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/split-links.ts split-plan.json

      # Issues made and labels set with GITHUB_TOKEN start no workflow, but a dispatch does.
      - name: Run Board sync
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run board-sync.yml --repo ${{ github.repository }}
