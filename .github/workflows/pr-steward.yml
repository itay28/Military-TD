name: PR steward

# Reconciles every open PR (docs/agents/issue-tracker.md → PR steward): fires a PR steward
# round (a cloud scheduled task that fixes conflicts, CI, review findings and maintainer
# comments, at most 2 rounds before handing off with `needs-you`), merges the base into a PR
# that is only behind, and squash-merges a PR that is green with every comment answered.
# Every run looks at all open PRs, so the schedule (three cron entries an hour, GitHub delivers
# only some, #328) fixes anything an event missed, and
# retries a round whose session died soon after its 1 h timeout (once for free, #303).
# Logic and tests: scripts/pr-steward.ts.
#
# Switches (repo variables, off unless `on`): AUTO_STEWARD fires rounds and updates branches,
# AUTO_MERGE merges. Before a conflict round it tries scripts/auto-resolve.ts (#474).
# ROUTINE_STEWARD_URL / _TOKEN are the steward task's API trigger.
# PROJECT_TOKEN (classic PAT) does the writes, so its pushes and merges start CI.
#
# API quota (#293): PROJECT_TOKEN's requests count against the maintainer's own hourly quota,
# shared with Board sync and every other workflow that uses it. So every run first passes the
# debounce job (scripts/debounce.ts, #417): it sweeps at once when no other run is active, yields
# green to a newer run that will sweep, and waits for an older one that is still sweeping. A burst
# (CI and the review finishing, an agent's comments) ends in at most two sweeps, nothing is
# cancelled (a cancelled run shows as a red ✗ on the PR), and runs never overlap. Each run logs the
# requests it made and the quota left; an exhausted quota logs its reset time and passes green
# (scripts/rate-limit.ts).
#
# Status labels (#419): every run gives each open PR one `waiting: …` / `ready to merge` label, even
# with the switches off. So a label follows within one run, it also runs when a PR turns draft or
# ready or closes, when an issue's labels, milestone or state change (a `needs-info` answered, a
# blocker closed), and on the maintainer's comment on a `needs-info` issue. Not on
# `pull_request: labeled`: its own label writes would wake it again.
on:
  workflow_run:
    workflows: [CI, Claude Code Review]
    types: [completed]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [converted_to_draft, ready_for_review, closed]
  issues:
    types: [labeled, unlabeled, milestoned, demilestoned, closed]
  push:
    branches: [main]
  schedule:
    - cron: '1,21,41 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debounce:
    name: debounce
    # Comments on plain issues don't concern PRs, except an answer on a `needs-info` issue (it
    # holds the PR that closes it, #419); fork PRs get no secrets. In a public repo anyone can
    # comment, so only the maintainer's comments and reviews start a run (#221).
    if: >-
      (github.event_name != 'issue_comment' ||
        ((github.event.issue.pull_request || contains(github.event.issue.labels.*.name, 'needs-info')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))) &&
      (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) &&
      (github.event_name != 'pull_request_review' || (!github.event.pull_request.head.repo.fork &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)))
    # Lets only the newest run of a burst sweep, with no fixed wait and nothing cancelled (#417):
    # older runs pass green and their sweep is skipped (scripts/debounce.ts).
    permissions:
      actions: read
    outputs:
      go: ${{ steps.gate.outputs.go }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Let the newest run of a burst sweep
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/debounce.ts

  pr-steward:
    name: pr-steward
    needs: debounce
    if: needs.debounce.outputs.go == 'true'
    # Runs queue instead of overlapping; each one reads the PRs fresh.
    concurrency:
      group: pr-steward
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # No persisted GITHUB_TOKEN: a conflict in generated files is merged here without an agent
      # (scripts/auto-resolve.ts, #474) and pushed with PROJECT_TOKEN, so the push starts CI.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Steward the open PRs
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          AUTO_STEWARD: ${{ vars.AUTO_STEWARD }}
          AUTO_MERGE: ${{ vars.AUTO_MERGE }}
          ROUTINE_STEWARD_URL: ${{ secrets.ROUTINE_STEWARD_URL }}
          ROUTINE_STEWARD_TOKEN: ${{ secrets.ROUTINE_STEWARD_TOKEN }}
        run: node scripts/pr-steward.ts
