name: PR title

# The PR title becomes the squash commit on main, and its Conventional Commit
# type drives release-please's version bump (ADR-0004). This check fails
# when the title doesn't match. Rule and tests: scripts/pr-title.ts.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# No concurrency group: a push and a title edit at once (release-please) start two runs on the
# same commit, and cancelling one would show a ✗ next to the green one (#257). Both runs check
# the PR's current title, so they agree.
permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The title is read when the run starts, not from the event, so an older run can't report a
      # stale title. It goes through a variable, never straight into the shell, so a title can't
      # inject commands.
      - name: Check PR title
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_TITLE="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .title)"
          export PR_TITLE
          node scripts/pr-title.ts
