name: Size issue

# The sizing agent (#205): when an issue is labelled ready-for-agent and nobody sized it, Claude
# (Sonnet) reads it and adds one size:* and one priority:* label, with a one-line comment on why.
# Board sync copies the labels to the board's Size and Priority fields, and auto-start can then
# start it. Prompt: docs/agents/prompts/size.md. The check uses the PROJECT_TOKEN secret, since
# GITHUB_TOKEN can't read a user-owned project; the agent itself only gets GITHUB_TOKEN.
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to size
        required: true
        type: number

concurrency:
  group: size-issue-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  size-issue:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ready-for-agent'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      # Dispatching Board sync afterwards.
      actions: write
      id-token: write
    env:
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check whether it needs sizing
        id: check
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: node scripts/size-issue.ts "$ISSUE"

      - name: Size it
        if: steps.check.outputs.needed == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read docs/agents/prompts/size.md and follow it for issue #${{ env.ISSUE }} in ${{ github.repository }}.
            You are running in CI. Nobody can answer questions, so don't ask any.
          claude_args: '--model sonnet --allowedTools "Read,Glob,Grep,Bash(gh issue view ${{ env.ISSUE }} *),Bash(gh issue edit ${{ env.ISSUE }} --add-label *),Bash(gh issue comment ${{ env.ISSUE }} *)"'

      # Labels added with GITHUB_TOKEN start no workflow, but a dispatch does.
      - name: Run Board sync
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run board-sync.yml --repo ${{ github.repository }}
