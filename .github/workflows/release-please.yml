name: Release

# release-please keeps an open release PR that bumps the version and updates
# CHANGELOG.md from the Conventional Commits on main. Merging that PR tags
# vX.Y.Z and publishes a GitHub Release (ADR-0004). Config:
# release-please-config.json and .release-please-manifest.json.
on:
  push:
    branches: [main]

# Releases run one at a time, in push order.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # release-please labels its PRs autorelease: pending / tagged.
  issues: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    # The itch.io deploy (ADR-0005) adds a job here that needs this one and runs
    # when release_created is 'true'. A Release made with GITHUB_TOKEN doesn't
    # start other workflows, so a separate `on: release` workflow would never run.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # Optional PAT secret: with it, CI runs on the release PR (PRs opened
          # with GITHUB_TOKEN don't start workflows). Without it, this still works.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
