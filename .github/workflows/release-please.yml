name: Release

# release-please keeps an open release PR that bumps the version and updates
# CHANGELOG.md from the Conventional Commits on main. Merging that PR tags
# vX.Y.Z and publishes a GitHub Release (ADR-0004), which the deploy job then
# pushes to itch.io (deploy.yml, ADR-0005). Config:
# release-please-config.json and .release-please-manifest.json.
on:
  push:
    branches: [main]

# Releases run one at a time, in push order.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # release-please labels its PRs autorelease: pending / tagged.
  issues: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # Optional PAT secret: with it, CI runs on the release PR (PRs opened
          # with GITHUB_TOKEN don't start workflows). Without it, this still works.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Ships the new release to itch.io (ADR-0005). A Release made with GITHUB_TOKEN
  # doesn't start other workflows, so an `on: release` trigger would never run;
  # this job calls the reusable deploy workflow instead.
  deploy:
    name: deploy
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  # A milestone release (v0.N.0, vN.0.0) closes the milestone's release issue,
  # with a comment linking the GitHub Release, and the milestone. The board's
  # "Item closed" automation moves the card to Done. Patch releases do nothing.
  # Logic and tests: scripts/release-board.ts.
  release-issue:
    name: release-issue
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Close the milestone's release issue and the milestone
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-board.ts release "$TAG"
