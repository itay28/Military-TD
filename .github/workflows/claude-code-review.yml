name: Claude Code Review

# Reviews a PR with Matt Pocock's code-review skill (Standards + Spec axes)
# and posts the report as one PR comment. It runs on the user's Claude plan, so
# it runs once: when a PR is opened as ready or marked ready (drafts are
# skipped), not on each push. Adding the `review-again` label runs it again.
on:
  pull_request:
    types: [opened, ready_for_review, reopened, labeled]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: >-
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 'review-again')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # Removing the review-again label goes through the issues API.
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so the skill can diff against the merge-base with the base branch
          fetch-depth: 0

      - name: Remove the review-again label
        if: github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --remove-label review-again

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-plugins-official.git'
          plugins: 'mattpocock-skills@claude-plugins-official'
          prompt: |
            /mattpocock-skills:code-review origin/${{ github.event.pull_request.base.ref }}

            You are running in CI on PR #${{ github.event.pull_request.number }} in ${{ github.repository }}. Nobody can answer questions, so don't ask any:
            - The fixed point is `origin/${{ github.event.pull_request.base.ref }}`.
            - The spec is the issue named by `Closes #n` in the PR body (`gh pr view ${{ github.event.pull_request.number }} --json body,closingIssuesReferences`); read it with `gh issue view <n> --json title,body,comments`. If the PR closes no issue, skip the Spec axis and say "no spec: the PR closes no issue".
            - Standards sources: CLAUDE.md, docs/agents/workflow.md, docs/adr/, docs/assets.md, GLOSSARY.md.

            When the report is ready, post it as a single PR comment with `gh pr comment ${{ github.event.pull_request.number }} --body-file <file>`, starting with the heading "## Code review (mattpocock-skills:code-review)". Don't edit files or push.
          claude_args: '--model sonnet --allowedTools "Read,Glob,Grep,Task,Agent,Write,Bash(git diff:*),Bash(git log:*),Bash(git rev-parse:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(gh pr comment:*)"'
