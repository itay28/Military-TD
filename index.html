<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Military TD</title>
    <link rel="stylesheet" href="/src/ui/fonts.css" />
    <style>
      /* The military look (#399): the palette and faces of src/data/theme.ts (theme.test.ts keeps them in step). Rules
         use only these tokens, and size text in rem, so the text-size setting (#354) scales it from the root size. */
      :root {
        --olive-950: #14170f;
        --olive-900: #1b1e16;
        --olive-800: #232820;
        --olive-700: #343a29;
        --olive-600: #4a4f3c;
        --olive-500: #5e6350;
        --green-600: #5b6b3a;
        --tan: #c2a46b;
        --tan-light: #e8d9b0;
        --bone: #e4e0c8;
        --bone-dim: #a2a58f;
        --bone-muted: #959179;
        --amber: #f0c95a;
        --danger: #e0533d;
        --ok: #6fcf4f;
        --link: #9cc8e8;
        --font-stencil: 'Allerta Stencil', 'Allerta Stencil Fallback', sans-serif;
        --font-mono: 'IBM Plex Mono', 'IBM Plex Mono Fallback', monospace;
        /* Corner brackets: an L in tan at each corner of a frame, drawn as background layers so they stay put when
           a dialog's content scrolls. Put before the frame's own background. */
        --brackets:
          linear-gradient(var(--tan), var(--tan)) left top / 10px 2px no-repeat,
          linear-gradient(var(--tan), var(--tan)) left top / 2px 10px no-repeat,
          linear-gradient(var(--tan), var(--tan)) right top / 10px 2px no-repeat,
          linear-gradient(var(--tan), var(--tan)) right top / 2px 10px no-repeat,
          linear-gradient(var(--tan), var(--tan)) left bottom / 10px 2px no-repeat,
          linear-gradient(var(--tan), var(--tan)) left bottom / 2px 10px no-repeat,
          linear-gradient(var(--tan), var(--tan)) right bottom / 10px 2px no-repeat,
          linear-gradient(var(--tan), var(--tan)) right bottom / 2px 10px no-repeat;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--olive-950);
        font-family: var(--font-mono);
      }
      /* The HUD and build bar are DOM, not Phaser text (ADR-0003): the HUD along the top and the build bar against
         the right edge, so neither covers the map. The stage takes the rest of the window, and the camera fits the map
         in it, so the game fits any screen with no page scroll. */
      #app {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-rows: auto minmax(0, 1fr);
        grid-template-areas:
          'hud hud'
          'stage bar';
        gap: 6px;
        box-sizing: border-box;
        height: 100%;
        height: 100dvh;
        padding: 6px;
      }
      /* Three fixed groups (#274): the stats, a message slot and the controls. The slot takes the leftover space and
         clips its text, so nothing the HUD says can move a button or make the HUD taller. */
      #hud {
        grid-area: hud;
        display: flex;
        align-items: center;
        gap: 14px;
        box-sizing: border-box;
        min-height: 36px;
        padding: 0 8px;
        font: 1rem var(--font-mono);
        color: var(--bone);
      }
      #hud .hud-stats {
        display: flex;
        flex: none;
        gap: 8px;
      }
      /* Fixed widths, so Funds $100 → $75 or DPS – → DPS 12 doesn't shift its neighbours. */
      #hud .hud-stats > span {
        display: block;
        white-space: nowrap;
      }
      #hud [data-testid='hud-money'] {
        min-width: 11ch;
      }
      /* The HQ: label, a bar of the Lives left and "14/20". The digits keep a fixed width, so a leak shifts nothing.
         The bar turns amber at half and red at a quarter; the number says the same without colour. */
      #hud .hud-stats > .hq {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #hud .hq-bar {
        position: relative;
        width: 32px;
        height: 10px;
        box-sizing: border-box;
        border: 1px solid var(--bone-dim);
        background: var(--olive-950);
      }
      #hud .hq-fill {
        position: absolute;
        inset: 0 auto 0 0;
        background: var(--ok);
      }
      #hud .hq[data-level='low'] .hq-fill {
        background: var(--amber);
      }
      #hud .hq[data-level='critical'] .hq-fill {
        background: var(--danger);
      }
      #hud .hq-count {
        min-width: 5ch;
      }
      #hud [data-testid='hud-wave'] {
        min-width: 12ch;
      }
      #hud [data-testid='hud-dps'] {
        min-width: 8ch;
      }
      #hud .hud-message {
        flex: 1;
        min-width: 0;
        height: 1.3em;
        line-height: 1.3;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      #hud .hud-message > * {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #hud .hud-banner {
        color: var(--amber);
        font-weight: bold;
      }
      #hud .hud-controls {
        display: flex;
        flex: none;
        align-items: center;
        gap: 6px;
      }
      #hud button {
        padding: 4px 14px;
        font: bold 0.9375rem var(--font-mono);
        color: var(--olive-900);
        background: var(--tan);
        border: 0;
        cursor: pointer;
      }
      .speed-group {
        display: flex;
        gap: 3px;
      }
      #hud .speed-group button {
        padding: 4px 5px;
        color: var(--tan);
        background: transparent;
        box-shadow: inset 0 0 0 2px var(--tan);
      }
      #hud .speed-group button[aria-pressed='true'] {
        color: var(--olive-900);
        background: var(--tan);
      }
      #hud .speed-group button:disabled {
        color: var(--olive-500);
        background: transparent;
        box-shadow: inset 0 0 0 2px var(--olive-500);
      }
      #pause-menu .speed-group {
        justify-content: center;
        margin: 8px 0;
      }
      #pause-menu .speed-group button {
        min-width: 0;
        padding: 6px 14px;
        color: var(--tan);
        background: transparent;
        box-shadow: inset 0 0 0 2px var(--tan);
      }
      #pause-menu .speed-group button[aria-pressed='true'] {
        color: var(--olive-900);
        background: var(--tan);
      }
      #hud button:disabled {
        background: var(--olive-500);
        color: var(--bone-dim);
        cursor: default;
      }
      #hud button:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 2px;
      }
      /* A toggle: outlined when off, filled when on. */
      #hud .hud-toggle {
        color: var(--tan);
        background: transparent;
        box-shadow: inset 0 0 0 2px var(--tan);
      }
      #hud .hud-toggle[aria-pressed='true'] {
        color: var(--olive-900);
        background: var(--tan);
      }
      #hud .hud-toggle:disabled {
        color: var(--olive-500);
        background: transparent;
        box-shadow: inset 0 0 0 2px var(--olive-500);
      }
      /* A phone: smaller type. After the base rules, so it wins. */
      @media (max-width: 640px), (max-height: 480px) {
        #hud {
          gap: 4px 12px;
          min-height: 28px;
          font-size: 0.8125rem;
        }
        #hud .hud-stats {
          gap: 12px;
        }
        #hud button {
          padding: 3px 10px;
          font-size: 0.8125rem;
        }
      }
      /* A narrow screen: three fixed rows, stats / controls / message. The message row is kept when empty. */
      @media (max-width: 640px) {
        #hud {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
          align-items: start;
        }
        #hud .hud-stats {
          flex-wrap: nowrap;
          gap: 8px;
        }
        #hud .hud-controls {
          order: 1;
        }
        #hud .hud-message {
          order: 2;
        }
      }
      /* The End screen covers the canvas, so the map takes no clicks while it's open. */
      #stage {
        grid-area: stage;
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      #game {
        position: absolute;
        inset: 0;
      }
      /* Drags and pinches on the map move the camera, not the page. */
      #game canvas {
        display: block;
        touch-action: none;
      }
      /* Against the right edge: a toggle that folds it away, then two columns of tower buttons (icon, cost and
         hotkey), greyed out when the player can't afford it. */
      #build-bar {
        grid-area: bar;
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 104px;
        min-height: 0;
        overflow-y: auto;
      }
      #build-bar[data-collapsed='true'] {
        width: 28px;
      }
      #build-bar .build-toggle {
        align-self: flex-end;
        width: 28px;
        height: 28px;
        padding: 0;
        font: 0.75rem var(--font-mono);
        border-width: 1px;
      }
      #build-bar .build-grid {
        display: grid;
        gap: 4px;
      }
      #build-bar .build-grid[hidden] {
        display: none;
      }
      #build-bar button {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px 0 5px;
        font: bold 0.8125rem var(--font-mono);
        color: var(--bone);
        background: var(--olive-800);
        border: 2px solid var(--olive-600);
        cursor: pointer;
      }
      #build-bar button[aria-pressed='true'] {
        border-color: var(--amber);
        background: var(--olive-700);
      }
      #build-bar button:disabled {
        cursor: default;
      }
      /* Unaffordable: a selected kind stays clickable (to clear it) but looks the same. */
      #build-bar button[aria-disabled='true'] {
        color: var(--bone-muted);
      }
      #build-bar button[aria-disabled='true'] .build-icon {
        opacity: 0.4;
      }
      #build-bar button:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 2px;
      }
      #build-bar .build-icon {
        position: relative;
        box-sizing: border-box;
        width: 24px;
        height: 24px;
        border: 2px solid;
      }
      #build-bar kbd {
        position: absolute;
        top: 1px;
        left: 3px;
        font: 0.625rem var(--font-mono);
        color: var(--bone-dim);
      }
      #end-screen,
      #pause-menu {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: color-mix(in srgb, var(--olive-900) 72%, transparent);
        font: 1rem var(--font-mono);
        color: var(--bone);
      }
      /* `display: flex` above would otherwise override the hidden attribute. The pause menu is styled like the End screen. */
      #end-screen[hidden],
      #pause-menu[hidden] {
        display: none;
      }
      /* The Paused dialog is hidden while the Settings screen takes its place. */
      #pause-menu [role='dialog'][hidden] {
        display: none;
      }
      #end-screen [role='dialog'],
      #pause-menu [role='dialog'] {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        box-sizing: border-box;
        max-height: calc(100% - 16px);
        overflow-y: auto;
        padding: 16px 24px;
        background: var(--olive-800);
        border: 2px solid var(--tan);
      }
      /* Scroll cue: a glow on an edge with hidden content.
         The `local` cover layers hide it where nothing is clipped. */
      #end-screen [role='dialog'] {
        background:
          var(--brackets),
          linear-gradient(var(--olive-800) 30%, transparent) top / 100% 24px local no-repeat,
          linear-gradient(transparent, var(--olive-800) 70%) bottom / 100% 24px local no-repeat,
          radial-gradient(farthest-side at 50% 0, color-mix(in srgb, var(--amber) 50%, transparent), transparent) top /
            100% 10px scroll no-repeat,
          radial-gradient(farthest-side at 50% 100%, color-mix(in srgb, var(--amber) 50%, transparent), transparent)
            bottom / 100% 10px scroll no-repeat,
          var(--olive-800);
      }
      #end-screen h2,
      #pause-menu h2 {
        margin: 0;
        font-size: 2rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--amber);
      }
      #end-screen h3 {
        margin: 0;
        font-size: 0.9375rem;
        letter-spacing: 0.06em;
        color: var(--tan);
      }
      #end-screen p,
      #pause-menu p {
        margin: 0;
      }
      /* A win's Stars, big enough to read at a glance; the words after them say the same for screen readers. */
      #end-screen .star-glyphs {
        font-size: 1.75rem;
        letter-spacing: 0.1em;
        color: var(--amber);
        vertical-align: middle;
      }
      /* The damage report: small tables side by side, wrapping as the dialog narrows. */
      #end-screen .report {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 10px 20px;
        font-size: 0.75rem;
      }
      #end-screen table {
        border-collapse: collapse;
      }
      #end-screen caption {
        padding-bottom: 2px;
        text-align: left;
        font-weight: bold;
        color: var(--tan);
      }
      #end-screen th,
      #end-screen td {
        padding: 1px 6px;
        text-align: right;
        font-weight: normal;
        white-space: nowrap;
      }
      #end-screen th[scope='row'],
      #end-screen thead th:first-child {
        text-align: left;
      }
      #end-screen thead th {
        border-bottom: 1px solid var(--green-600);
        color: var(--bone-dim);
      }
      #end-screen tfoot th,
      #end-screen tfoot td {
        border-top: 1px solid var(--green-600);
        font-weight: bold;
      }
      #end-screen button,
      #pause-menu button {
        padding: 6px 22px;
        font: bold 1rem var(--font-mono);
        color: var(--olive-900);
        background: var(--tan);
        border: 0;
        cursor: pointer;
      }
      #end-screen button:focus-visible,
      #pause-menu button:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 2px;
      }
      #pause-menu button {
        min-width: 180px;
      }
      #pause-menu button:disabled {
        color: var(--bone-dim);
        background: var(--olive-500);
        cursor: default;
      }
      /* The tower panel sits over the top-right of the map; the End screen, after it, covers it. */
      #tower-panel {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 220px;
        max-width: calc(100% - 16px);
        max-height: calc(100% - 16px);
        overflow-y: auto;
        font: 0.8125rem var(--font-mono);
        overflow-wrap: anywhere;
        color: var(--bone);
      }
      #tower-panel [role='dialog'] {
        position: relative;
        box-sizing: border-box;
        padding: 10px 12px;
        background: color-mix(in srgb, var(--olive-800) 92%, transparent);
        border: 2px solid var(--tan);
      }
      #tower-panel h2 {
        margin: 0 24px 2px 0;
        font-size: 0.9375rem;
        color: var(--amber);
      }
      #tower-panel p {
        margin: 0 0 8px;
        color: var(--bone-dim);
      }
      #tower-panel dl {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 2px 10px;
        margin: 0;
      }
      #tower-panel dt {
        color: var(--bone-dim);
      }
      #tower-panel dd {
        margin: 0;
        text-align: right;
      }
      #tower-panel button[aria-label='Close'] {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 24px;
        height: 24px;
        padding: 0;
        font: bold 1rem var(--font-mono);
        color: var(--bone);
        background: transparent;
        border: 0;
        cursor: pointer;
      }
      @media (max-width: 640px), (max-height: 480px) {
        #tower-panel {
          width: 190px;
          font-size: 0.75rem;
        }
      }
      #tower-panel button:focus-visible {
        outline: 2px solid var(--amber);
      }
      #tower-panel [data-testid='tower-upgrade'] {
        display: block;
        width: 100%;
        margin-top: 10px;
        padding: 4px 8px;
        font: bold 0.8125rem var(--font-mono);
        color: var(--olive-900);
        background: var(--tan);
        border: 0;
        cursor: pointer;
      }
      #tower-panel [data-testid='tower-upgrade'][hidden] {
        display: none;
      }
      #tower-panel [data-testid='tower-upgrade']:disabled {
        color: var(--bone-muted);
        background: var(--olive-700);
        cursor: not-allowed;
      }
      #tower-panel [data-testid='tower-sell'] {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 4px 8px;
        font: bold 0.8125rem var(--font-mono);
        color: var(--tan-light);
        background: transparent;
        border: 1px solid var(--bone-muted);
        cursor: pointer;
      }
      /* The Main menu and Level select cover the whole page; the game's UI is hidden behind them, out of the accessibility tree too. */
      #app[data-screen] :is(#hud, #build-bar, #tower-panel) {
        display: none;
      }
      #menu,
      #level-select {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        overflow-y: auto;
        background: var(--olive-900);
        font: 1rem var(--font-mono);
        color: var(--bone);
      }
      /* Centred when it fits; a taller screen scrolls from its top (plain `justify-content: center` would clip both ends). */
      #level-select {
        box-sizing: border-box;
        padding: 16px 0;
      }
      #menu > :first-child,
      #level-select > :first-child {
        margin-top: auto;
      }
      #menu > :last-child,
      #level-select > :last-child {
        margin-bottom: auto;
      }
      /* `display: flex` above would otherwise override the hidden attribute. */
      #menu[hidden],
      #level-select[hidden] {
        display: none;
      }
      #menu h1,
      #level-select h1 {
        margin: 0 0 18px;
        font-size: 2.5rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--amber);
      }
      #menu button,
      #level-select > button {
        width: 200px;
        padding: 8px 0;
        font: bold 1.125rem var(--font-mono);
        color: var(--olive-900);
        background: var(--tan);
        border: 0;
        cursor: pointer;
      }
      #menu button:disabled {
        background: var(--olive-500);
        color: var(--bone-dim);
        cursor: default;
      }
      /* The Credits screen: the list takes the height left between the title and Back and scrolls when it's longer. */
      #menu {
        box-sizing: border-box;
        padding: 16px;
      }
      #menu .credits-list {
        flex: 0 1 auto;
        min-height: 0;
        width: min(640px, 100%);
        overflow-y: auto;
        box-sizing: border-box;
        padding-right: 8px;
      }
      #menu .credit,
      #menu .game-credits {
        margin-bottom: 14px;
      }
      #menu .credits-list h2 {
        margin: 0 0 4px;
        font-size: 1rem;
        color: var(--amber);
      }
      #menu .credits-list p {
        margin: 2px 0;
      }
      #menu .credits-list a {
        color: var(--link);
        overflow-wrap: anywhere;
      }
      #menu button:focus-visible,
      #level-select button:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 2px;
      }
      #level-select ul {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 16px;
        margin: 0 0 18px;
        padding: 0 16px;
        list-style: none;
      }
      /* A map: its preview, then its name. */
      #level-select button.map {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 8px;
        font: bold 1rem var(--font-mono);
        color: var(--bone);
        background: var(--olive-800);
        border: 2px solid var(--olive-500);
        cursor: pointer;
      }
      #level-select button.map:hover {
        border-color: var(--tan);
      }
      /* Best Stars, or the lock mark and "Locked", under the name. */
      #level-select .stars {
        font-size: 1.25rem;
        letter-spacing: 0.1em;
        color: var(--amber);
      }
      #level-select .locked {
        font-size: 0.875rem;
        color: var(--bone-dim);
      }
      /* A locked map stays focusable (aria-disabled), but looks and acts disabled. */
      #level-select button.map[aria-disabled='true'] {
        color: var(--bone-dim);
        border-color: var(--olive-600);
        cursor: default;
      }
      #level-select button.map[aria-disabled='true'] canvas {
        opacity: 0.45;
      }
      #level-select canvas {
        display: block;
        max-width: 100%;
      }
      /* The Settings screen covers the whole page, over the Main menu or the paused game, whichever opened it. */
      #settings {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: color-mix(in srgb, var(--olive-900) 88%, transparent);
        font: 1rem var(--font-mono);
        color: var(--bone);
      }
      /* `display: flex` above would otherwise override the hidden attribute. */
      #settings[hidden] {
        display: none;
      }
      #settings [role='dialog'] {
        display: flex;
        flex-direction: column;
        gap: 14px;
        box-sizing: border-box;
        max-width: calc(100% - 32px);
        max-height: calc(100% - 16px);
        overflow-y: auto;
        padding: 16px 24px;
        background: var(--olive-800);
        border: 2px solid var(--tan);
      }
      #settings h2 {
        margin: 0;
        font-size: 1.375rem;
        text-align: center;
        color: var(--amber);
      }
      #settings fieldset {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 18px;
        margin: 0;
        padding: 8px 12px 10px;
        border: 1px solid var(--olive-500);
      }
      #settings legend {
        padding: 0 4px;
        color: var(--tan);
      }
      #settings label {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }
      #settings input {
        accent-color: var(--tan);
        width: 18px;
        height: 18px;
        margin: 0;
      }
      /* A volume slider (#67): its name and value on one line, the slider full width under them. */
      #settings .volume {
        display: grid;
        grid-template-areas: 'name value' 'slider slider';
        grid-template-columns: 1fr auto;
        gap: 4px 12px;
      }
      #settings .volume label {
        grid-area: name;
      }
      #settings .volume output {
        grid-area: value;
        min-width: 4ch;
        text-align: right;
        color: var(--tan);
      }
      #settings .volume input {
        grid-area: slider;
        width: 100%;
        min-width: 200px;
        height: 24px;
        cursor: pointer;
      }
      #settings button {
        align-self: center;
        width: 160px;
        padding: 6px 0;
        font: bold 1rem var(--font-mono);
        color: var(--olive-900);
        background: var(--tan);
        border: 0;
        cursor: pointer;
      }
      #settings :is(button, input):focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 2px;
      }
      #version {
        position: fixed;
        right: 6px;
        bottom: 4px;
        font: 0.75rem var(--font-mono);
        color: var(--bone-muted);
        pointer-events: none;
      }
      /* Field-terminal frames (#399): a thin olive line with tan corner brackets, square corners, stencil titles and
         small-caps labels. After the rules above, so these win. */
      #hud,
      #tower-panel [role='dialog'],
      #end-screen [role='dialog'],
      #pause-menu [role='dialog'],
      #settings [role='dialog'],
      #level-select button.map {
        border: 1px solid var(--olive-600);
      }
      #hud {
        background: var(--brackets), var(--olive-800);
      }
      #pause-menu [role='dialog'],
      #settings [role='dialog'],
      #level-select button.map {
        background: var(--brackets), var(--olive-800);
      }
      #tower-panel [role='dialog'] {
        background: var(--brackets), color-mix(in srgb, var(--olive-800) 94%, transparent);
      }
      #level-select button.map:hover,
      #level-select button.map:focus-visible {
        border-color: var(--tan);
      }
      #level-select button.map[aria-disabled='true'] {
        border-color: var(--olive-600);
      }
      :is(
        #menu h1,
        #level-select h1,
        #end-screen h2,
        #pause-menu h2,
        #settings h2,
        #tower-panel h2,
        #menu .credits-list h2
      ) {
        font-family: var(--font-stencil);
        font-weight: normal;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      #menu h1,
      #level-select h1 {
        font-size: 2.75rem;
        letter-spacing: 0.12em;
      }
      /* A selected tower reads like a unit on a field order: "1-3 RIFLE NEST", its designator in amber. */
      #tower-panel h2 {
        color: var(--bone);
      }
      #tower-panel h2 .designator {
        color: var(--amber);
      }
      :is(
        #tower-panel dt,
        #tower-panel [data-testid='tower-level'],
        #settings legend,
        #end-screen caption,
        #end-screen thead th
      ) {
        font-variant-caps: small-caps;
        letter-spacing: 0.06em;
      }
      #hud .hud-stats > span,
      #tower-panel dd {
        color: var(--amber);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud"></div>
      <div id="stage">
        <div id="game"></div>
        <div id="tower-panel" hidden></div>
        <div id="end-screen" hidden></div>
        <div id="pause-menu" hidden></div>
      </div>
      <nav id="build-bar" aria-label="Build"></nav>
    </div>
    <main id="menu" hidden></main>
    <main id="level-select" hidden></main>
    <div id="settings" hidden></div>
    <div id="version"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
