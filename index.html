<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Military TD</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b1e16;
      }
      /* The HUD and build bar are DOM, not Phaser text (ADR-0003): the HUD above the canvas and the build bar
         right of it, so neither covers the map. */
      #app {
        display: grid;
        grid-template-columns: auto auto;
        grid-template-areas:
          'hud .'
          'stage bar';
        place-content: safe center; /* on a small window, scroll instead of clipping the HUD off the top */
        gap: 6px;
        height: 100%;
      }
      #hud {
        grid-area: hud;
        display: flex;
        align-items: center;
        gap: 20px;
        box-sizing: border-box;
        min-height: 36px;
        padding: 0 8px;
        font: 16px monospace;
        color: #e4e0c8;
      }
      #hud .hud-banner {
        color: #f0c95a;
        font-weight: bold;
      }
      #hud button {
        margin-left: auto;
        order: 1;
        padding: 4px 14px;
        font: bold 15px monospace;
        color: #1b1e16;
        background: #c2a46b;
        border: 0;
        border-radius: 3px;
        cursor: pointer;
      }
      #hud button:disabled {
        background: #5e6350;
        color: #a2a58f;
        cursor: default;
      }
      #hud button:focus-visible {
        outline: 2px solid #f0c95a;
        outline-offset: 2px;
      }
      /* The End screen covers the canvas, so the map takes no clicks while it's open. */
      #stage {
        grid-area: stage;
        position: relative;
      }
      /* Two columns of tower buttons: icon, cost and hotkey. Greyed out when the player can't afford it. */
      #build-bar {
        grid-area: bar;
        align-self: start;
        width: 104px;
      }
      #build-bar .build-grid {
        display: grid;
        gap: 4px;
      }
      #build-bar button {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px 0 5px;
        font: bold 13px monospace;
        color: #e4e0c8;
        background: #262a1f;
        border: 2px solid #4a4f3c;
        border-radius: 3px;
        cursor: pointer;
      }
      #build-bar button[aria-pressed='true'] {
        border-color: #f0c95a;
        background: #343a29;
      }
      #build-bar button:disabled {
        color: #8a8670;
        cursor: default;
      }
      #build-bar button:disabled .build-icon {
        opacity: 0.4;
      }
      #build-bar button:focus-visible {
        outline: 2px solid #f0c95a;
        outline-offset: 2px;
      }
      #build-bar .build-icon {
        box-sizing: border-box;
        width: 24px;
        height: 24px;
        border: 2px solid;
      }
      #build-bar kbd {
        position: absolute;
        top: 1px;
        left: 3px;
        font: 10px monospace;
        color: #a2a58f;
      }
      #end-screen {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgb(27 30 22 / 0.72);
        font: 16px monospace;
        color: #e4e0c8;
      }
      /* `display: flex` above would otherwise override the hidden attribute. */
      #end-screen[hidden] {
        display: none;
      }
      #end-screen [role='dialog'] {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 24px 40px;
        background: #262a1f;
        border: 2px solid #c2a46b;
        border-radius: 4px;
      }
      #end-screen h2 {
        margin: 0;
        font-size: 32px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #f0c95a;
      }
      #end-screen p {
        margin: 0;
      }
      #end-screen button {
        padding: 6px 22px;
        font: bold 16px monospace;
        color: #1b1e16;
        background: #c2a46b;
        border: 0;
        border-radius: 3px;
        cursor: pointer;
      }
      #end-screen button:focus-visible {
        outline: 2px solid #f0c95a;
        outline-offset: 2px;
      }
      /* The tower panel sits over the top-right of the map; the End screen, after it, covers it. */
      #tower-panel {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 220px;
        font: 13px monospace;
        white-space: nowrap;
        color: #e4e0c8;
      }
      #tower-panel [role='dialog'] {
        position: relative;
        padding: 10px 12px;
        background: rgb(38 42 31 / 0.92);
        border: 2px solid #c2a46b;
        border-radius: 4px;
      }
      #tower-panel h2 {
        margin: 0 24px 2px 0;
        font-size: 15px;
        color: #f0c95a;
      }
      #tower-panel p {
        margin: 0 0 8px;
        color: #a2a58f;
      }
      #tower-panel dl {
        display: grid;
        grid-template-columns: auto auto;
        gap: 2px 10px;
        margin: 0;
      }
      #tower-panel dt {
        color: #a2a58f;
      }
      #tower-panel dd {
        margin: 0;
        text-align: right;
      }
      #tower-panel button {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 24px;
        height: 24px;
        padding: 0;
        font: bold 16px monospace;
        color: #e4e0c8;
        background: transparent;
        border: 0;
        cursor: pointer;
      }
      #tower-panel button:focus-visible {
        outline: 2px solid #f0c95a;
      }
      #version {
        position: fixed;
        right: 6px;
        bottom: 4px;
        font: 12px monospace;
        color: #8a8670;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud"></div>
      <div id="stage">
        <div id="game"></div>
        <div id="tower-panel" hidden></div>
        <div id="end-screen" hidden></div>
      </div>
      <nav id="build-bar" aria-label="Build"></nav>
    </div>
    <div id="version"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
