<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Military TD</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1b1e16;
      }
      /* The HUD and build bar are DOM, not Phaser text (ADR-0003): the HUD along the top and the build bar against
         the right edge, so neither covers the map. The stage takes the rest of the window, and the camera fits the map
         in it, so the game fits any screen with no page scroll. */
      #app {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-rows: auto minmax(0, 1fr);
        grid-template-areas:
          'hud hud'
          'stage bar';
        gap: 6px;
        box-sizing: border-box;
        height: 100%;
        height: 100dvh;
        padding: 6px;
      }
      /* Three fixed groups (#274): the stats, a message slot and the controls. The slot takes the leftover space and
         clips its text, so nothing the HUD says can move a button or make the HUD taller. */
      #hud {
        grid-area: hud;
        display: flex;
        align-items: center;
        gap: 20px;
        box-sizing: border-box;
        min-height: 36px;
        padding: 0 8px;
        font: 16px monospace;
        color: #e4e0c8;
      }
      #hud .hud-stats {
        display: flex;
        flex: none;
        gap: 12px;
      }
      /* Fixed widths, so Money 100 → 75 or DPS – → DPS 12 doesn't shift its neighbours. */
      #hud .hud-stats > span {
        display: block;
        white-space: nowrap;
      }
      #hud [data-testid='hud-money'] {
        min-width: 11ch;
      }
      #hud [data-testid='hud-lives'] {
        min-width: 8ch;
      }
      #hud [data-testid='hud-wave'] {
        min-width: 12ch;
      }
      #hud [data-testid='hud-dps'] {
        min-width: 9ch;
      }
      #hud .hud-message {
        flex: 1;
        min-width: 0;
        height: 1.3em;
        line-height: 1.3;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      #hud .hud-message > * {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #hud .hud-banner {
        color: #f0c95a;
        font-weight: bold;
      }
      #hud .hud-controls {
        display: flex;
        flex: none;
        align-items: center;
        gap: 6px;
      }
      #hud button {
        padding: 4px 14px;
        font: bold 15px monospace;
        color: #1b1e16;
        background: #c2a46b;
        border: 0;
        border-radius: 3px;
        cursor: pointer;
      }
      .speed-group {
        display: flex;
        gap: 3px;
      }
      #hud .speed-group button {
        padding: 4px 5px;
        color: #c2a46b;
        background: transparent;
        box-shadow: inset 0 0 0 2px #c2a46b;
      }
      #hud .speed-group button[aria-pressed='true'] {
        color: #1b1e16;
        background: #c2a46b;
      }
      #hud .speed-group button:disabled {
        color: #5e6350;
        background: transparent;
        box-shadow: inset 0 0 0 2px #5e6350;
      }
      #pause-menu .speed-group {
        justify-content: center;
        margin: 8px 0;
      }
      #pause-menu .speed-group button {
        min-width: 0;
        padding: 6px 14px;
        color: #c2a46b;
        background: transparent;
        box-shadow: inset 0 0 0 2px #c2a46b;
      }
      #pause-menu .speed-group button[aria-pressed='true'] {
        color: #1b1e16;
        background: #c2a46b;
      }
      #hud button:disabled {
        background: #5e6350;
        color: #a2a58f;
        cursor: default;
      }
      #hud button:focus-visible {
        outline: 2px solid #f0c95a;
        outline-offset: 2px;
      }
      /* A toggle: outlined when off, filled when on. */
      #hud .hud-toggle {
        color: #c2a46b;
        background: transparent;
        box-shadow: inset 0 0 0 2px #c2a46b;
      }
      #hud .hud-toggle[aria-pressed='true'] {
        color: #1b1e16;
        background: #c2a46b;
      }
      #hud .hud-toggle:disabled {
        color: #5e6350;
        background: transparent;
        box-shadow: inset 0 0 0 2px #5e6350;
      }
      /* The DPS figure is a button that opens the DPS meter (#243): it reads as the figure, underlined. */
      #hud {
        position: relative;
      }
      #hud .hud-stats > button.hud-dps {
        min-width: 9ch;
        padding: 0;
        font: inherit;
        text-align: left;
        white-space: nowrap;
        color: inherit;
        background: none;
        text-decoration: underline dotted;
        text-underline-offset: 3px;
      }
      #hud .hud-stats > button.hud-dps[aria-expanded='true'] {
        color: #f0c95a;
      }
      /* The DPS meter hangs under the HUD at the map's top-left corner, clear of its centre and of the tower panel
         (top-right); it scrolls when it is taller than its cap. Under the End screen and Pause overlays. */
      #hud .dps-meter {
        position: absolute;
        top: calc(100% + 14px);
        left: 8px;
        z-index: 1;
        box-sizing: border-box;
        width: 280px;
        max-width: calc(100vw - 32px);
        max-height: 55vh;
        overflow-y: auto;
        padding: 6px;
        font: 12px monospace;
        background: rgb(27 30 22 / 0.88);
        border: 1px solid #8a8670;
        border-radius: 3px;
      }
      #hud .dps-meter[hidden] {
        display: none;
      }
      #hud .dps-scope {
        display: flex;
        gap: 3px;
        margin-bottom: 6px;
      }
      #hud .dps-scope button {
        flex: 1;
        padding: 2px 4px;
        font: bold 12px monospace;
        color: #c2a46b;
        background: transparent;
        box-shadow: inset 0 0 0 2px #c2a46b;
      }
      #hud .dps-scope button[aria-pressed='true'] {
        color: #1b1e16;
        background: #c2a46b;
      }
      #hud .dps-empty {
        margin: 4px 2px;
        color: #a2a58f;
      }
      #hud .dps-kinds,
      #hud .dps-towers {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #hud .dps-kind + .dps-kind {
        margin-top: 4px;
      }
      /* One kind: swatch, name, DPS, kills and share on a line, the share bar under it. */
      #hud .dps-meter button.dps-kind-row {
        display: grid;
        grid-template-columns: 12px minmax(0, 1fr) auto auto 4ch;
        align-items: center;
        gap: 2px 6px;
        width: 100%;
        padding: 3px 4px;
        font: 12px monospace;
        text-align: left;
        color: #e4e0c8;
        background: rgb(228 224 200 / 0.06);
        border-radius: 2px;
      }
      #hud .dps-swatch {
        box-sizing: border-box;
        width: 12px;
        height: 12px;
        border: 2px solid;
      }
      #hud .dps-swatch[data-shape='circle'] {
        border-radius: 50%;
      }
      #hud .dps-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #hud .dps-share {
        text-align: right;
      }
      #hud .dps-bar {
        grid-column: 1 / -1;
        height: 3px;
        background: rgb(228 224 200 / 0.12);
      }
      #hud .dps-bar-fill {
        display: block;
        height: 100%;
        background: #c2a46b;
      }
      #hud .dps-towers[hidden] {
        display: none;
      }
      #hud .dps-tower {
        padding: 1px 4px 1px 22px;
        color: #c9c5ad;
        white-space: nowrap;
      }
      #hud .dps-tower[data-sold='true'] {
        color: #8a8670;
      }
      /* A phone: smaller type. After the base rules, so it wins. */
      @media (max-width: 640px), (max-height: 480px) {
        #hud {
          gap: 4px 12px;
          min-height: 28px;
          font-size: 13px;
        }
        #hud .hud-stats {
          gap: 12px;
        }
        #hud button {
          padding: 3px 10px;
          font-size: 13px;
        }
      }
      /* A narrow screen: three fixed rows, stats / controls / message. The message row is kept when empty. */
      @media (max-width: 640px) {
        #hud {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
          align-items: start;
        }
        #hud .hud-stats {
          flex-wrap: nowrap;
          gap: 8px;
        }
        #hud .hud-controls {
          order: 1;
        }
        #hud .hud-message {
          order: 2;
        }
        /* As wide as the map's column, clear of the build bar beside it. */
        #hud .dps-meter {
          width: calc(100vw - 132px);
          max-height: 45vh;
        }
        #hud .dps-meter button.dps-kind-row {
          grid-template-columns: 12px minmax(0, 1fr) auto 4ch;
        }
        #hud .dps-kills {
          display: none;
        }
      }
      /* The End screen covers the canvas, so the map takes no clicks while it's open. */
      #stage {
        grid-area: stage;
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      #game {
        position: absolute;
        inset: 0;
      }
      /* Drags and pinches on the map move the camera, not the page. */
      #game canvas {
        display: block;
        touch-action: none;
      }
      /* Against the right edge: a toggle that folds it away, then two columns of tower buttons (icon, cost and
         hotkey), greyed out when the player can't afford it. */
      #build-bar {
        grid-area: bar;
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 104px;
        min-height: 0;
        overflow-y: auto;
      }
      #build-bar[data-collapsed='true'] {
        width: 28px;
      }
      #build-bar .build-toggle {
        align-self: flex-end;
        width: 28px;
        height: 28px;
        padding: 0;
        font: 12px monospace;
        border-width: 1px;
      }
      #build-bar .build-grid {
        display: grid;
        gap: 4px;
      }
      #build-bar .build-grid[hidden] {
        display: none;
      }
      #build-bar button {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px 0 5px;
        font: bold 13px monospace;
        color: #e4e0c8;
        background: #262a1f;
        border: 2px solid #4a4f3c;
        border-radius: 3px;
        cursor: pointer;
      }
      #build-bar button[aria-pressed='true'] {
        border-color: #f0c95a;
        background: #343a29;
      }
      #build-bar button:disabled {
        cursor: default;
      }
      /* Unaffordable: a selected kind stays clickable (to clear it) but looks the same. */
      #build-bar button[aria-disabled='true'] {
        color: #99957c;
      }
      #build-bar button[aria-disabled='true'] .build-icon {
        opacity: 0.4;
      }
      #build-bar button:focus-visible {
        outline: 2px solid #f0c95a;
        outline-offset: 2px;
      }
      #build-bar .build-icon {
        position: relative;
        box-sizing: border-box;
        width: 24px;
        height: 24px;
        border: 2px solid;
      }
      /* A tower's stats, left of its button over the map; placed by buildBar.ts, which keeps the tile under the
         pointer or finger clear. Taps go through it. */
      #build-bar .build-tip {
        position: fixed;
        z-index: 5;
        box-sizing: border-box;
        width: max-content;
        max-width: 180px;
        padding: 6px 8px;
        font: 11px/1.35 monospace;
        color: #e4e0c8;
        background: rgb(27 30 22 / 0.94);
        border: 1px solid #4a4f3c;
        border-radius: 3px;
        pointer-events: none;
      }
      #build-bar .build-tip[hidden] {
        display: none;
      }
      #build-bar .build-tip strong {
        display: block;
        font-size: 12px;
        color: #f0c95a;
      }
      #build-bar .build-tip p {
        margin: 2px 0 4px;
        color: #c8c4ac;
      }
      #build-bar .build-tip dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0 8px;
        margin: 0;
      }
      #build-bar .build-tip dt {
        color: #a2a58f;
      }
      #build-bar .build-tip dd {
        margin: 0;
      }
      #build-bar kbd {
        position: absolute;
        top: 1px;
        left: 3px;
        font: 10px monospace;
        color: #a2a58f;
      }
      #end-screen,
      #pause-menu {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgb(27 30 22 / 0.72);
        font: 16px monospace;
        color: #e4e0c8;
      }
      /* `display: flex` above would otherwise override the hidden attribute. The pause menu is styled like the End screen. */
      #end-screen[hidden],
      #pause-menu[hidden] {
        display: none;
      }
      /* The Paused dialog is hidden while the Settings screen takes its place. */
      #pause-menu [role='dialog'][hidden] {
        display: none;
      }
      #end-screen [role='dialog'],
      #pause-menu [role='dialog'] {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        box-sizing: border-box;
        max-height: calc(100% - 16px);
        overflow-y: auto;
        padding: 16px 24px;
        background: #262a1f;
        border: 2px solid #c2a46b;
        border-radius: 4px;
      }
      /* Scroll cue: a glow on an edge with hidden content.
         The `local` cover layers hide it where nothing is clipped. */
      #end-screen [role='dialog'] {
        background:
          linear-gradient(#262a1f 30%, rgb(38 42 31 / 0)) top / 100% 24px local no-repeat,
          linear-gradient(rgb(38 42 31 / 0), #262a1f 70%) bottom / 100% 24px local no-repeat,
          radial-gradient(farthest-side at 50% 0, rgb(240 201 90 / 0.5), rgb(240 201 90 / 0)) top / 100% 10px scroll
            no-repeat,
          radial-gradient(farthest-side at 50% 100%, rgb(240 201 90 / 0.5), rgb(240 201 90 / 0)) bottom / 100% 10px
            scroll no-repeat,
          #262a1f;
      }
      #end-screen h2,
      #pause-menu h2 {
        margin: 0;
        font-size: 32px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #f0c95a;
      }
      #end-screen p,
      #pause-menu p {
        margin: 0;
      }
      /* A win's Stars, big enough to read at a glance; the words after them say the same for screen readers. */
      #end-screen .star-glyphs {
        font-size: 28px;
        letter-spacing: 0.1em;
        color: #f0c95a;
        vertical-align: middle;
      }
      /* The damage report: small tables side by side, wrapping as the dialog narrows. */
      #end-screen .report {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 10px 20px;
        font-size: 12px;
      }
      #end-screen table {
        border-collapse: collapse;
      }
      #end-screen caption {
        padding-bottom: 2px;
        text-align: left;
        font-weight: bold;
        color: #c2a46b;
      }
      #end-screen th,
      #end-screen td {
        padding: 1px 6px;
        text-align: right;
        font-weight: normal;
        white-space: nowrap;
      }
      #end-screen th[scope='row'],
      #end-screen thead th:first-child {
        text-align: left;
      }
      #end-screen thead th {
        border-bottom: 1px solid #5b6b3a;
        color: #a2a58f;
      }
      #end-screen tfoot th,
      #end-screen tfoot td {
        border-top: 1px solid #5b6b3a;
        font-weight: bold;
      }
      #end-screen button,
      #pause-menu button {
        padding: 6px 22px;
        font: bold 16px monospace;
        color: #1b1e16;
        background: #c2a46b;
        border: 0;
        border-radius: 3px;
        cursor: pointer;
      }
      #end-screen button:focus-visible,
      #pause-menu button:focus-visible {
        outline: 2px solid #f0c95a;
        outline-offset: 2px;
      }
      #pause-menu button {
        min-width: 180px;
      }
      #pause-menu button:disabled {
        color: #a2a58f;
        background: #5e6350;
        cursor: default;
      }
      /* The tower panel (or the enemy card: one at a time) sits over the top-right of the map; the End screen, after it, covers it. */
      #tower-panel,
      #enemy-card {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 220px;
        max-width: calc(100% - 16px);
        max-height: calc(100% - 16px);
        overflow-y: auto;
        font: 13px monospace;
        overflow-wrap: anywhere;
        color: #e4e0c8;
      }
      #tower-panel [role='dialog'],
      #enemy-card [role='dialog'] {
        position: relative;
        box-sizing: border-box;
        padding: 10px 12px;
        background: rgb(38 42 31 / 0.92);
        border: 2px solid #c2a46b;
        border-radius: 4px;
      }
      #tower-panel h2,
      #enemy-card h2 {
        margin: 0 24px 2px 0;
        font-size: 15px;
        color: #f0c95a;
      }
      #tower-panel p,
      #enemy-card p {
        margin: 0 0 8px;
        color: #a2a58f;
      }
      #tower-panel dl,
      #enemy-card dl {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 2px 10px;
        margin: 0;
      }
      #tower-panel dt,
      #enemy-card dt {
        color: #a2a58f;
      }
      #tower-panel dd,
      #enemy-card dd {
        margin: 0;
        text-align: right;
      }
      #tower-panel button[aria-label='Close'],
      #enemy-card button[aria-label='Close'] {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 24px;
        height: 24px;
        padding: 0;
        font: bold 16px monospace;
        color: #e4e0c8;
        background: transparent;
        border: 0;
        cursor: pointer;
      }
      @media (max-width: 640px), (max-height: 480px) {
        #tower-panel,
        #enemy-card {
          width: 190px;
          font-size: 12px;
        }
      }
      #tower-panel p.role,
      #enemy-card p.role {
        color: #e4e0c8;
      }
      #enemy-card p.role {
        margin: 8px 0 0;
      }
      #tower-panel button:focus-visible,
      #enemy-card button:focus-visible {
        outline: 2px solid #f0c95a;
      }
      #tower-panel [data-testid='tower-upgrade'] {
        display: block;
        width: 100%;
        margin-top: 10px;
        padding: 4px 8px;
        font: bold 13px monospace;
        color: #1b1e16;
        background: #c2a46b;
        border: 0;
        border-radius: 3px;
        cursor: pointer;
      }
      #tower-panel [data-testid='tower-upgrade'][hidden] {
        display: none;
      }
      #tower-panel [data-testid='tower-upgrade']:disabled {
        color: #8a8670;
        background: #3b4030;
        cursor: not-allowed;
      }
      #tower-panel [data-testid='tower-sell'] {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 4px 8px;
        font: bold 13px monospace;
        color: #e8d9b0;
        background: transparent;
        border: 1px solid #8a8670;
        border-radius: 3px;
        cursor: pointer;
      }
      /* The Main menu and Level select cover the whole page; the game's UI is hidden behind them, out of the accessibility tree too. */
      #app[data-screen] :is(#hud, #build-bar, #tower-panel, #enemy-card, #hints) {
        display: none;
      }
      #menu,
      #level-select {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        overflow-y: auto;
        background: #1b1e16;
        font: 16px monospace;
        color: #e4e0c8;
      }
      /* Centred when it fits; a taller screen scrolls from its top (plain `justify-content: center` would clip both ends). */
      #level-select {
        box-sizing: border-box;
        padding: 16px 0;
      }
      #menu > :first-child,
      #level-select > :first-child {
        margin-top: auto;
      }
      #menu > :last-child,
      #level-select > :last-child {
        margin-bottom: auto;
      }
      /* `display: flex` above would otherwise override the hidden attribute. */
      #menu[hidden],
      #level-select[hidden] {
        display: none;
      }
      #menu h1,
      #level-select h1 {
        margin: 0 0 18px;
        font-size: 40px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #f0c95a;
      }
      #menu button,
      #level-select > button {
        width: 200px;
        padding: 8px 0;
        font: bold 18px monospace;
        color: #1b1e16;
        background: #c2a46b;
        border: 0;
        border-radius: 3px;
        cursor: pointer;
      }
      #menu button:disabled {
        background: #5e6350;
        color: #a2a58f;
        cursor: default;
      }
      /* The Credits screen: the list takes the height left between the title and Back and scrolls when it's longer. */
      #menu {
        box-sizing: border-box;
        padding: 16px;
      }
      #menu .credits-list {
        flex: 0 1 auto;
        min-height: 0;
        width: min(640px, 100%);
        overflow-y: auto;
        box-sizing: border-box;
        padding-right: 8px;
      }
      #menu .credit,
      #menu .game-credits {
        margin-bottom: 14px;
      }
      #menu .credits-list h2 {
        margin: 0 0 4px;
        font-size: 16px;
        color: #f0c95a;
      }
      #menu .credits-list p {
        margin: 2px 0;
      }
      #menu .credits-list a {
        color: #9cc8e8;
        overflow-wrap: anywhere;
      }
      #menu button:focus-visible,
      #level-select button:focus-visible {
        outline: 2px solid #f0c95a;
        outline-offset: 2px;
      }
      #level-select ul {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 16px;
        margin: 0 0 18px;
        padding: 0 16px;
        list-style: none;
      }
      /* A map: its preview, then its name. */
      #level-select button.map {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 8px;
        font: bold 16px monospace;
        color: #e4e0c8;
        background: #262a1f;
        border: 2px solid #5e6350;
        border-radius: 4px;
        cursor: pointer;
      }
      #level-select button.map:hover {
        border-color: #c2a46b;
      }
      /* Best Stars, or the lock mark and "Locked", under the name. */
      #level-select .stars {
        font-size: 20px;
        letter-spacing: 0.1em;
        color: #f0c95a;
      }
      #level-select .locked {
        font-size: 14px;
        color: #a2a58f;
      }
      /* A locked map stays focusable (aria-disabled), but looks and acts disabled. */
      #level-select button.map[aria-disabled='true'] {
        color: #a2a58f;
        border-color: #3e4234;
        cursor: default;
      }
      #level-select button.map[aria-disabled='true'] canvas {
        opacity: 0.45;
      }
      #level-select canvas {
        display: block;
        max-width: 100%;
      }
      /* The Settings screen covers the whole page, over the Main menu or the paused game, whichever opened it. */
      #settings {
        position: fixed;
        inset: 0;
        z-index: 3; /* over the Pause overlay (2), which is over the DPS meter (1) */
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgb(27 30 22 / 0.88);
        font: 16px monospace;
        color: #e4e0c8;
      }
      /* `display: flex` above would otherwise override the hidden attribute. */
      #settings[hidden] {
        display: none;
      }
      #settings [role='dialog'] {
        display: flex;
        flex-direction: column;
        gap: 14px;
        box-sizing: border-box;
        max-width: calc(100% - 32px);
        max-height: calc(100% - 16px);
        overflow-y: auto;
        padding: 16px 24px;
        background: #262a1f;
        border: 2px solid #c2a46b;
        border-radius: 4px;
      }
      #settings h2 {
        margin: 0;
        font-size: 22px;
        text-align: center;
        color: #f0c95a;
      }
      #settings fieldset {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 18px;
        margin: 0;
        padding: 8px 12px 10px;
        border: 1px solid #5e6350;
        border-radius: 3px;
      }
      #settings legend {
        padding: 0 4px;
        color: #c2a46b;
      }
      #settings label {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }
      #settings input {
        accent-color: #c2a46b;
        width: 18px;
        height: 18px;
        margin: 0;
      }
      /* A volume slider (#67): its name and value on one line, the slider full width under them. */
      #settings .volume {
        display: grid;
        grid-template-areas: 'name value' 'slider slider';
        grid-template-columns: 1fr auto;
        gap: 4px 12px;
      }
      #settings .volume label {
        grid-area: name;
      }
      #settings .volume output {
        grid-area: value;
        min-width: 4ch;
        text-align: right;
        color: #c2a46b;
      }
      #settings .volume input {
        grid-area: slider;
        width: 100%;
        min-width: 200px;
        height: 24px;
        cursor: pointer;
      }
      #settings button {
        align-self: center;
        width: 160px;
        padding: 6px 0;
        font: bold 16px monospace;
        color: #1b1e16;
        background: #c2a46b;
        border: 0;
        border-radius: 3px;
        cursor: pointer;
      }
      #settings .show-hints {
        width: auto;
        min-width: 160px;
        padding: 6px 12px;
      }
      #settings .hints-note {
        margin: 0;
        text-align: center;
      }
      #settings .hints-note:empty {
        display: none;
      }
      #settings :is(button, input):focus-visible {
        outline: 2px solid #f0c95a;
        outline-offset: 2px;
      }
      /* The first-map hints (#68): a layer over the whole page that never takes the pointer, but for Skip hints. The
         callout is placed by script next to what it points at, with an arrow toward it. */
      #hints {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }
      #hints[hidden] {
        display: none;
      }
      #hints .hint {
        position: absolute;
        box-sizing: border-box;
        width: max-content;
        max-width: min(240px, calc(100vw - 16px));
        padding: 8px 10px;
        font: 13px monospace;
        color: #1b1e16;
        background: #f0c95a;
        border-radius: 4px;
        box-shadow: 0 2px 6px rgb(0 0 0 / 0.5);
      }
      #hints .hint p {
        margin: 0 0 6px;
      }
      #hints .hint button {
        pointer-events: auto;
        padding: 2px 8px;
        font: inherit;
        color: #e4e0c8;
        background: #3a3f2f;
        border: 1px solid #1b1e16;
        border-radius: 3px;
        cursor: pointer;
      }
      #hints .hint button:focus-visible {
        outline: 2px solid #1b1e16;
        outline-offset: 2px;
      }
      #hints .hint::after {
        content: '';
        position: absolute;
        border: 8px solid transparent;
      }
      #hints .hint[data-side='below']::after {
        bottom: 100%;
        left: calc(var(--arrow-x, 50%) - 8px);
        border-bottom-color: #f0c95a;
      }
      #hints .hint[data-side='above']::after {
        top: 100%;
        left: calc(var(--arrow-x, 50%) - 8px);
        border-top-color: #f0c95a;
      }
      #hints .hint[data-side='left']::after {
        left: 100%;
        top: calc(50% - 8px);
        border-left-color: #f0c95a;
      }
      #version {
        position: fixed;
        right: 6px;
        bottom: 4px;
        font: 12px monospace;
        color: #8a8670;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud"></div>
      <div id="stage">
        <div id="game"></div>
        <div id="tower-panel" hidden></div>
        <div id="enemy-card" hidden></div>
        <div id="end-screen" hidden></div>
        <div id="pause-menu" hidden></div>
      </div>
      <nav id="build-bar" aria-label="Build"></nav>
      <div id="hints" hidden></div>
    </div>
    <main id="menu" hidden></main>
    <main id="level-select" hidden></main>
    <div id="settings" hidden></div>
    <div id="version"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
