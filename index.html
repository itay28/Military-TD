<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Military TD</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1b1e16;
      }
      /* The HUD and build bar are DOM, not Phaser text (ADR-0003): the HUD along the top and the build bar against
         the right edge, so neither covers the map. The stage takes the rest of the window, and the camera fits the map
         in it, so the game fits any screen with no page scroll. */
      #app {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-rows: auto minmax(0, 1fr);
        grid-template-areas:
          'hud hud'
          'stage bar';
        gap: 6px;
        box-sizing: border-box;
        height: 100%;
        height: 100dvh;
        padding: 6px;
      }
      #hud {
        grid-area: hud;
        display: flex;
        align-items: center;
        gap: 20px;
        box-sizing: border-box;
        min-height: 36px;
        padding: 0 8px;
        font: 16px monospace;
        color: #e4e0c8;
      }
      /* A phone: the HUD wraps and shrinks rather than pushing the page wider. */
      @media (max-width: 640px), (max-height: 480px) {
        #hud {
          flex-wrap: wrap;
          gap: 4px 12px;
          min-height: 28px;
          font-size: 13px;
        }
        #hud button {
          padding: 3px 10px;
          font-size: 13px;
        }
      }
      #hud .hud-banner {
        color: #f0c95a;
        font-weight: bold;
      }
      #hud button {
        margin-left: auto;
        order: 1;
        padding: 4px 14px;
        font: bold 15px monospace;
        color: #1b1e16;
        background: #c2a46b;
        border: 0;
        border-radius: 3px;
        cursor: pointer;
      }
      #hud button:disabled {
        background: #5e6350;
        color: #a2a58f;
        cursor: default;
      }
      #hud button:focus-visible {
        outline: 2px solid #f0c95a;
        outline-offset: 2px;
      }
      /* A toggle: outlined when off, filled when on. It sits right after Start Wave. */
      #hud .hud-toggle {
        margin-left: 0;
        color: #c2a46b;
        background: transparent;
        box-shadow: inset 0 0 0 2px #c2a46b;
      }
      #hud .hud-toggle[aria-pressed='true'] {
        color: #1b1e16;
        background: #c2a46b;
      }
      #hud .hud-toggle:disabled {
        color: #5e6350;
        background: transparent;
        box-shadow: inset 0 0 0 2px #5e6350;
      }
      /* The End screen covers the canvas, so the map takes no clicks while it's open. */
      #stage {
        grid-area: stage;
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      #game {
        position: absolute;
        inset: 0;
      }
      /* Drags and pinches on the map move the camera, not the page. */
      #game canvas {
        display: block;
        touch-action: none;
      }
      /* Against the right edge: a toggle that folds it away, then two columns of tower buttons (icon, cost and
         hotkey), greyed out when the player can't afford it. */
      #build-bar {
        grid-area: bar;
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 104px;
        min-height: 0;
        overflow-y: auto;
      }
      #build-bar[data-collapsed='true'] {
        width: 28px;
      }
      #build-bar .build-toggle {
        align-self: flex-end;
        width: 28px;
        height: 28px;
        padding: 0;
        font: 12px monospace;
        border-width: 1px;
      }
      #build-bar .build-grid {
        display: grid;
        gap: 4px;
      }
      #build-bar .build-grid[hidden] {
        display: none;
      }
      #build-bar button {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px 0 5px;
        font: bold 13px monospace;
        color: #e4e0c8;
        background: #262a1f;
        border: 2px solid #4a4f3c;
        border-radius: 3px;
        cursor: pointer;
      }
      #build-bar button[aria-pressed='true'] {
        border-color: #f0c95a;
        background: #343a29;
      }
      #build-bar button:disabled {
        color: #8a8670;
        cursor: default;
      }
      #build-bar button:disabled .build-icon {
        opacity: 0.4;
      }
      #build-bar button:focus-visible {
        outline: 2px solid #f0c95a;
        outline-offset: 2px;
      }
      #build-bar .build-icon {
        box-sizing: border-box;
        width: 24px;
        height: 24px;
        border: 2px solid;
      }
      #build-bar kbd {
        position: absolute;
        top: 1px;
        left: 3px;
        font: 10px monospace;
        color: #a2a58f;
      }
      #end-screen {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgb(27 30 22 / 0.72);
        font: 16px monospace;
        color: #e4e0c8;
      }
      /* `display: flex` above would otherwise override the hidden attribute. */
      #end-screen[hidden] {
        display: none;
      }
      #end-screen [role='dialog'] {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        box-sizing: border-box;
        max-height: calc(100% - 16px);
        overflow-y: auto;
        padding: 16px 24px;
        background: #262a1f;
        border: 2px solid #c2a46b;
        border-radius: 4px;
      }
      #end-screen h2 {
        margin: 0;
        font-size: 32px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #f0c95a;
      }
      #end-screen p {
        margin: 0;
      }
      /* The damage report: small tables side by side, wrapping as the dialog narrows. */
      #end-screen .report {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 10px 20px;
        font-size: 12px;
      }
      #end-screen table {
        border-collapse: collapse;
      }
      #end-screen caption {
        padding-bottom: 2px;
        text-align: left;
        font-weight: bold;
        color: #c2a46b;
      }
      #end-screen th,
      #end-screen td {
        padding: 1px 6px;
        text-align: right;
        font-weight: normal;
        white-space: nowrap;
      }
      #end-screen th[scope='row'],
      #end-screen thead th:first-child {
        text-align: left;
      }
      #end-screen thead th {
        border-bottom: 1px solid #5b6b3a;
        color: #a2a58f;
      }
      #end-screen tfoot th,
      #end-screen tfoot td {
        border-top: 1px solid #5b6b3a;
        font-weight: bold;
      }
      #end-screen button {
        padding: 6px 22px;
        font: bold 16px monospace;
        color: #1b1e16;
        background: #c2a46b;
        border: 0;
        border-radius: 3px;
        cursor: pointer;
      }
      #end-screen button:focus-visible {
        outline: 2px solid #f0c95a;
        outline-offset: 2px;
      }
      /* The tower panel sits over the top-right of the map; the End screen, after it, covers it. */
      #tower-panel {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 220px;
        max-width: calc(100% - 16px);
        max-height: calc(100% - 16px);
        overflow-y: auto;
        font: 13px monospace;
        overflow-wrap: anywhere;
        color: #e4e0c8;
      }
      #tower-panel [role='dialog'] {
        position: relative;
        box-sizing: border-box;
        padding: 10px 12px;
        background: rgb(38 42 31 / 0.92);
        border: 2px solid #c2a46b;
        border-radius: 4px;
      }
      #tower-panel h2 {
        margin: 0 24px 2px 0;
        font-size: 15px;
        color: #f0c95a;
      }
      #tower-panel p {
        margin: 0 0 8px;
        color: #a2a58f;
      }
      #tower-panel dl {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 2px 10px;
        margin: 0;
      }
      #tower-panel dt {
        color: #a2a58f;
      }
      #tower-panel dd {
        margin: 0;
        text-align: right;
      }
      #tower-panel button[aria-label='Close'] {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 24px;
        height: 24px;
        padding: 0;
        font: bold 16px monospace;
        color: #e4e0c8;
        background: transparent;
        border: 0;
        cursor: pointer;
      }
      @media (max-width: 640px), (max-height: 480px) {
        #tower-panel {
          width: 190px;
          font-size: 12px;
        }
      }
      #tower-panel button:focus-visible {
        outline: 2px solid #f0c95a;
      }
      #tower-panel [data-testid='tower-upgrade'] {
        display: block;
        width: 100%;
        margin-top: 10px;
        padding: 4px 8px;
        font: bold 13px monospace;
        color: #1b1e16;
        background: #c2a46b;
        border: 0;
        border-radius: 3px;
        cursor: pointer;
      }
      #tower-panel [data-testid='tower-upgrade'][hidden] {
        display: none;
      }
      #tower-panel [data-testid='tower-upgrade']:disabled {
        color: #8a8670;
        background: #3b4030;
        cursor: not-allowed;
      }
      #tower-panel [data-testid='tower-sell'] {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 4px 8px;
        font: bold 13px monospace;
        color: #e8d9b0;
        background: transparent;
        border: 1px solid #8a8670;
        border-radius: 3px;
        cursor: pointer;
      }
      /* The Main menu covers the whole page; the game's UI is hidden behind it, out of the accessibility tree too. */
      #app[data-screen='menu'] :is(#hud, #build-bar, #tower-panel) {
        display: none;
      }
      #menu {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #1b1e16;
        font: 16px monospace;
        color: #e4e0c8;
      }
      /* `display: flex` above would otherwise override the hidden attribute. */
      #menu[hidden] {
        display: none;
      }
      #menu h1 {
        margin: 0 0 18px;
        font-size: 40px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #f0c95a;
      }
      #menu button {
        width: 200px;
        padding: 8px 0;
        font: bold 18px monospace;
        color: #1b1e16;
        background: #c2a46b;
        border: 0;
        border-radius: 3px;
        cursor: pointer;
      }
      #menu button:disabled {
        background: #5e6350;
        color: #a2a58f;
        cursor: default;
      }
      #menu button:focus-visible {
        outline: 2px solid #f0c95a;
        outline-offset: 2px;
      }
      #version {
        position: fixed;
        right: 6px;
        bottom: 4px;
        font: 12px monospace;
        color: #8a8670;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud"></div>
      <div id="stage">
        <div id="game"></div>
        <div id="tower-panel" hidden></div>
        <div id="end-screen" hidden></div>
      </div>
      <nav id="build-bar" aria-label="Build"></nav>
    </div>
    <main id="menu" hidden></main>
    <div id="version"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
